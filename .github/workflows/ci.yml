name: CI

on:
  push:
    branches:
      - main
      - feature/workflow-platform
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Run unit tests (no Codex)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest

      - name: Run tests
        env:
          DATABASE_URL: "sqlite+pysqlite:///:memory:"
          # Not a real key. Workflow implementations only check `if not
          # api_key` before calling the OpenAI SDK; the actual client is
          # mocked in tests/conftest.py (autouse fixture), so no network
          # call is ever made. This just needs to be a non-empty string so
          # the workflow tests take the "ok" code path instead of the
          # "OPENAI_API_KEY not configured" degraded path.
          OPENAI_API_KEY: "sk-test-ci-mocked-not-a-real-key"
          # Not real secrets — app/main.py refuses to start without these
          # (fail-fast startup check), which until 2026-09-18 meant CI's
          # "Run tests" step never actually got past importing app.main.
          # Any run's JWT/HMAC signatures are worthless outside this
          # ephemeral CI job anyway (in-memory DB, thrown away when the
          # job ends), so a fixed dummy value is fine here — never reuse
          # these for anything that outlives one CI run.
          SECRET_KEY: "ci-dummy-secret-key-not-for-production-use-0000"
          AUDIT_SECRET_KEY: "ci-dummy-audit-secret-key-not-for-production-use-0000"
        run: |
          pytest -q -m "not codex"
