name: CI

on:
  push:
    branches:
      - main
      - feature/workflow-platform
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Run unit tests (no Codex)
    runs-on: ubuntu-latest

    # Fase B7: a throwaway PostgreSQL for tests/test_migration_b7_archive.py, which runs the
    # document migrations on PostgreSQL as well as SQLite (production is PostgreSQL). Only that
    # test uses it, via TEST_POSTGRES_URL; the rest of the suite stays on in-memory SQLite.
    # Dummy credentials: the database only lives for this one CI job.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-dummy-postgres-password
          POSTGRES_DB: migration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Batch R (2026-10-07): matches production's 3.12.3 (see CLAUDE.md §2) so a regression
          # that only shows up on 3.12 is no longer invisible to CI. Was 3.9 — the same version as
          # the local dev venv, which existed only because requirements.txt's presidio/spacy pins
          # once needed it; production has run 3.12 since before this project started tracking it.
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest

      - name: Run tests
        env:
          DATABASE_URL: "sqlite+pysqlite:///:memory:"
          # Not a real key. Workflow implementations only check `if not
          # api_key` before calling the OpenAI SDK; the actual client is
          # mocked in tests/conftest.py (autouse fixture), so no network
          # call is ever made. This just needs to be a non-empty string so
          # the workflow tests take the "ok" code path instead of the
          # "OPENAI_API_KEY not configured" degraded path.
          OPENAI_API_KEY: "sk-test-ci-mocked-not-a-real-key"
          # Not real secrets — app/main.py refuses to start without these
          # (fail-fast startup check), which until 2026-09-18 meant CI's
          # "Run tests" step never actually got past importing app.main.
          # Any run's JWT/HMAC signatures are worthless outside this
          # ephemeral CI job anyway (in-memory DB, thrown away when the
          # job ends), so a fixed dummy value is fine here — never reuse
          # these for anything that outlives one CI run.
          SECRET_KEY: "ci-dummy-secret-key-not-for-production-use-0000"
          AUDIT_SECRET_KEY: "ci-dummy-audit-secret-key-not-for-production-use-0000"
          # Fase B7: the PostgreSQL service above (migration test only).
          TEST_POSTGRES_URL: "postgresql+psycopg2://postgres:ci-dummy-postgres-password@localhost:5432/migration_test"
        run: |
          pytest -q -m "not codex"
