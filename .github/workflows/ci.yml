name: CI

on:
  push:
    branches:
      - main
      - feature/workflow-platform
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Run unit tests (no Codex)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest

      - name: Run tests
        env:
          DATABASE_URL: "sqlite+pysqlite:///:memory:"
          # Not a real key. Workflow implementations only check `if not
          # api_key` before calling the OpenAI SDK; the actual client is
          # mocked in tests/conftest.py (autouse fixture), so no network
          # call is ever made. This just needs to be a non-empty string so
          # the workflow tests take the "ok" code path instead of the
          # "OPENAI_API_KEY not configured" degraded path.
          OPENAI_API_KEY: "sk-test-ci-mocked-not-a-real-key"
        run: |
          pytest -q -m "not codex"
