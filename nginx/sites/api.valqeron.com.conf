# =============================================================================
# api.valqeron.com → FastAPI app on :8000
#
# One FastAPI process (app/main.py) serves the API, the static React
# frontend, and every workflow route. api./app./compliance.valqeron.com are
# three domains fronting the same upstream on :8000 — there is no separate
# frontend or compliance-specific service.
#
# Install: see scripts/setup_server.sh — it deploys this only after a
# certificate for this domain exists (bootstrapped via a temporary port-80
# stub + `certbot certonly --nginx`), since nginx refuses to load an ssl_*
# directive block pointing at cert files that don't exist yet.
# =============================================================================

server {
    listen 80;
    server_name api.valqeron.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.valqeron.com;

    ssl_certificate     /etc/letsencrypt/live/api.valqeron.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.valqeron.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options            "DENY"                                         always;
    add_header X-Content-Type-Options     "nosniff"                                      always;
    add_header X-XSS-Protection           "1; mode=block"                                always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin"              always;
    add_header Permissions-Policy         "geolocation=(), microphone=(), camera=()"     always;

    location /login {
        limit_req zone=login_limit burst=3 nodelay;
        limit_req_status 429;

        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        # Don't expose upstream errors
        proxy_intercept_errors on;
        error_page 502 503 504 /50x.html;
    }

    location = /50x.html {
        return 503 '{"error":"service_unavailable","message":"The service is temporarily unavailable."}';
        add_header Content-Type application/json;
    }

    # Block hidden files
    location ~ /\. { deny all; }
}
