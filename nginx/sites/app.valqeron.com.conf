# =============================================================================
# app.valqeron.com → static build of ai-governance-frontend (the client portal)
#
# HISTORY: until 2026-09-18 this domain proxied to the same FastAPI process as
# api./compliance.valqeron.com and showed that backend's marketing SPA
# (app/static/index.html + app.jsx, Babel-standalone in-browser transpilation
# via unpkg.com). That caused a two-round CSP saga (2026-09-13: unpkg.com
# scripts blocked; 2026-09-17: the Babel-standalone *inline* transpiled script
# also blocked, needing 'unsafe-inline') documented at length in CLAUDE.md
# sections 4/6. On 2026-09-18 Dennis decided app.valqeron.com should serve the
# real client portal (ai-governance-frontend) instead, and that the old
# marketing SPA should no longer be shown on ANY of the three platform
# subdomains (see app/main.py, which now returns plain JSON at "/" instead of
# that page). This rewrite replaces the FastAPI proxy with a static-file
# server for the portal's production build, which eliminates the CSP problem
# entirely: a Vite production build has no runtime transpilation and no
# unpkg.com/Babel-standalone dependency, so script-src can stay a strict
# 'self' with no 'unsafe-inline'. The portal's API calls go cross-origin to
# https://api.valqeron.com (already CORS-allowlisted server-side — see
# ALLOWED_ORIGINS in .env / app/core/middleware.py), so this server block
# needs no proxy_pass to the backend at all.
#
# DEPLOY NOTE: unlike the backend (git-pulled from ai-governance-os),
# ai-governance-frontend has no git repository (confirmed 2026-09-18) — its
# production build has to be copied to the server by hand (or via a future
# CI step) rather than picked up by `scripts/deploy.sh`'s `git pull`. The
# path below (/opt/valqeron-frontend/dist) is the assumed deploy target,
# parallel to /opt/valqeron for the backend — create it and `npm run build`
# the output there (see the Claude Code handoff for the exact steps) before
# this config is loaded, or nginx will 404/500 on every request.
# =============================================================================

server {
    listen 80;
    server_name app.valqeron.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name app.valqeron.com;

    ssl_certificate     /etc/letsencrypt/live/app.valqeron.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.valqeron.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options            "DENY"                                         always;
    add_header X-Content-Type-Options     "nosniff"                                      always;
    add_header X-XSS-Protection           "1; mode=block"                                always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin"              always;
    # Strict by design: no unpkg.com, no 'unsafe-inline' for scripts. A production Vite
    # build only needs its own bundled JS/CSS (script-src/style-src 'self'), Google Fonts
    # (index.css imports fonts.googleapis.com — same as the rest of the brand), and a
    # cross-origin connection to the API domain for fetch/XHR calls. 'unsafe-inline' stays
    # on style-src only because React's inline `style={{...}}` attributes need it in
    # browsers that don't yet split style-src-attr from style-src — this is unrelated to
    # the old Babel-standalone problem (no <script> tags are inline here).
    add_header Content-Security-Policy    "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://api.valqeron.com https://o4512123599388672.ingest.de.sentry.io;" always;

    root /opt/valqeron-frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\. { deny all; }
}
