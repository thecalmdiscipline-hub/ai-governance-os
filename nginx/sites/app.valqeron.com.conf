# =============================================================================
# app.valqeron.com → FastAPI app on :8000
#
# Same upstream as api.valqeron.com — see that file's header comment.
# =============================================================================

server {
    listen 80;
    server_name app.valqeron.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name app.valqeron.com;

    ssl_certificate     /etc/letsencrypt/live/app.valqeron.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.valqeron.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options            "DENY"                                         always;
    add_header X-Content-Type-Options     "nosniff"                                      always;
    add_header X-XSS-Protection           "1; mode=block"                                always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin"              always;
    # 2026-09-13: was "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline';",
    # which blocked the CDN scripts/fonts that app/static/index.html actually loads
    # (unpkg.com for React/ReactDOM/Babel-standalone, Google Fonts for the page font) —
    # confirmed live via browser console: "violates ... script-src 'self' ... blocked" for
    # both unpkg.com scripts, resulting in a blank app for every visitor to this domain.
    # compliance.valqeron.com and api.valqeron.com both have no CSP header and render fine —
    # this domain is the only one of the three affected.
    # 2026-09-17: the 2026-09-13 fix (adding https://unpkg.com to script-src) was deployed but
    # turned out incomplete — confirmed live via browser console after that deploy: the page was
    # STILL blank, now failing on a *different* CSP violation: "Executing inline script violates
    # ... script-src 'self' https://unpkg.com ... Either the 'unsafe-inline' keyword, a hash
    # (...), or a nonce (...) is required". Root cause: Babel-standalone (loaded from unpkg to
    # transpile app.jsx in-browser, since this app has no build step) transpiles the
    # type="text/babel" script and executes the result via an injected *inline* <script> tag,
    # which is a separate CSP category (inline-script) from the external unpkg.com script tags
    # fixed on 2026-09-13. This domain has no nonce/hash infrastructure (no server-side templating
    # of the CSP header — see app/main.py), so 'unsafe-inline' is added to script-src to allow it.
    # A hash-based allowlist was considered (Chrome's own console output supplies one) but rejected
    # as fragile: the hash is derived from app.jsx's transpiled output and would need to be
    # recomputed on every content change, which no part of the deploy pipeline currently automates.
    add_header Content-Security-Policy    "default-src 'self'; script-src 'self' 'unsafe-inline' https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com;" always;

    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
    }

    location ~ /\. { deny all; }
}
