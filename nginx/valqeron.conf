# =============================================================================
# valqeron.conf — Nginx configuration for the Valqeron platform
#
# Install:
#   cp nginx/valqeron.conf /etc/nginx/sites-available/valqeron
#   ln -s /etc/nginx/sites-available/valqeron /etc/nginx/sites-enabled/valqeron
#
# The rate-limiting zone must live in the http{} context. Create a separate
# file for it:
#   echo 'limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;' \
#       > /etc/nginx/conf.d/valqeron_rate_limit.conf
#
# After Certbot runs, it will append ssl_certificate directives automatically.
# =============================================================================

# ---------------------------------------------------------------------------
# Gzip
# ---------------------------------------------------------------------------
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_proxied any;
gzip_comp_level 6;
gzip_types text/plain text/css application/json application/javascript
           text/xml application/xml application/xml+rss text/javascript;

# ---------------------------------------------------------------------------
# Shared proxy settings (referenced via include or copy-paste)
# ---------------------------------------------------------------------------
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# =============================================================================
# api.valqeron.com → FastAPI app on :8000
# =============================================================================

server {
    listen 80;
    server_name api.valqeron.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.valqeron.com;

    # SSL — managed by Certbot
    ssl_certificate     /etc/letsencrypt/live/api.valqeron.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.valqeron.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options            "DENY"                                         always;
    add_header X-Content-Type-Options     "nosniff"                                      always;
    add_header X-XSS-Protection           "1; mode=block"                                always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin"              always;
    add_header Permissions-Policy         "geolocation=(), microphone=(), camera=()"     always;

    # Rate limit on login endpoint
    location /login {
        limit_req zone=login_limit burst=3 nodelay;
        limit_req_status 429;

        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        # Don't expose upstream errors
        proxy_intercept_errors on;
        error_page 502 503 504 /50x.html;
    }

    location = /50x.html {
        return 503 '{"error":"service_unavailable","message":"The service is temporarily unavailable."}';
        add_header Content-Type application/json;
    }

    # Block hidden files
    location ~ /\. { deny all; }
}

# =============================================================================
# app.valqeron.com → Frontend on :3000
# =============================================================================

server {
    listen 80;
    server_name app.valqeron.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name app.valqeron.com;

    ssl_certificate     /etc/letsencrypt/live/app.valqeron.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.valqeron.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options            "DENY"                                         always;
    add_header X-Content-Type-Options     "nosniff"                                      always;
    add_header X-XSS-Protection           "1; mode=block"                                always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin"              always;
    add_header Content-Security-Policy    "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline';" always;

    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
    }

    location ~ /\. { deny all; }
}

