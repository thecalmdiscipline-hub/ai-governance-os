# =============================================================================
# common.conf — directives shared across all Valqeron domains
#
# Install: cp nginx/snippets/common.conf /etc/nginx/conf.d/valqeron_common.conf
#
# This must be loaded exactly once in the http{} context. It exists as a
# separate file (rather than being copied into each per-domain site file
# under nginx/sites/) because nginx errors on a directive or map name
# appearing twice within the same context — with multiple site files loaded
# together from sites-enabled/, duplicating `map $http_upgrade ...` or
# `gzip_vary` in each of them would break config loading the moment more
# than one site is enabled.
#
# `gzip on;` is deliberately omitted — Ubuntu's stock /etc/nginx/nginx.conf
# already sets it inside http{}, and nginx treats a second `gzip on;` as a
# hard config error ("directive is duplicate"), not a harmless override.
# =============================================================================

gzip_vary on;
gzip_min_length 1024;
gzip_proxied any;
gzip_comp_level 6;
gzip_types text/plain text/css application/json application/javascript
           text/xml application/xml application/xml+rss text/javascript;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
