# Shared content blocks for the Valqeron client handout (NL/EN).
#
# Source: docs/handout/handout-inhoud-concept.md (Cowork, 8 okt 2026), carried over verbatim
# except where Fase 0 of Batch M found the concept's wording did not match the code — those
# corrections are marked below with "Fase 0:" and reported in the hand-off's final report.
# Every block lists the claim IDs (see claims.yaml) that back any factual promise it makes.
# `allow_absolute: true` marks a block whose "always/never/every/number" language is a negation
# ("no built-in approval step") rather than an overclaim, per the hand-off's negation rule.

blocks:
  welcome:
    claims: []
    nl: >-
      Welkom bij Valqeron. Deze handout hoort bij jullie omgeving en beschrijft alleen de
      onderdelen die voor jullie zijn ingericht. Valqeron helpt jullie AI gecontroleerd te
      gebruiken: AI doet een voorstel, een medewerker beoordeelt het resultaat voordat het wordt
      gebruikt. Het portaal is in het Engels; de schermafbeeldingen in deze handout tonen de
      Engelstalige interface.
    en: >-
      Welcome to Valqeron. This handout belongs to your environment and covers only the parts set
      up for you. Valqeron helps you use AI in a controlled way: the AI produces a proposal, and a
      team member reviews the result before it is used. The portal is in English, and the
      screenshots in this handout show the English interface.

  login:
    claims: [C7]
    nl: >-
      Je beheerder maakt je account aan en geeft je een eenmalig wachtwoord via een apart kanaal.
      Ga naar app.valqeron.com, vul je gebruikersnaam en wachtwoord in en kies bij de eerste keer
      een nieuw wachtwoord van minstens 12 tekens. Zonder nieuw wachtwoord kun je niets anders
      openen.
    en: >-
      Your administrator creates your account and gives you a one-time password through a
      separate channel. Go to app.valqeron.com, enter your username and password, and on first
      login choose a new password of at least 12 characters. Until you do, nothing else can be
      opened.

  change_password:
    claims: []
    nl: >-
      Wachtwoord wijzigen kan via de tab Account, onder "Password". Kies een wachtwoord dat je
      nergens anders gebruikt.
    en: >-
      You can change your password on the Account tab, under "Password". Choose a password you
      do not use anywhere else.

  mfa:
    claims: [C8]
    nl: >-
      Tweestapsverificatie is optioneel en aan te raden. Je zet het aan op de tab Account
      ("Two-step verification") met een authenticator-app. Bij het aanzetten krijg je 10 eenmalige
      back-upcodes: bewaar ze offline. Na vijf foute codes is de tweede stap 15 minuten
      geblokkeerd.
    en: >-
      Two-step verification is optional and recommended. You turn it on in the Account tab
      ("Two-step verification") using an authenticator app. When you turn it on you receive 10
      one-time backup codes: keep them offline. After five wrong codes, the second step is blocked
      for 15 minutes.

  progress_card:
    claims: [C10]
    nl: >-
      Zolang jullie onboarding loopt, toont de Home-tab een kaart met de voortgang per fase. Je
      ziet alleen de taken die voor jullie relevant zijn en kunt de taken afvinken die jullie zelf
      uitvoeren. Taken van Valqeron zie je, maar je kunt ze niet aanpassen.
    en: >-
      While your onboarding is in progress, the Home tab shows a card with progress per phase. You
      only see the tasks that are relevant to you and can tick off the tasks you perform yourself.
      Valqeron's tasks are visible, but you cannot change them.

  support:
    claims: [C9]
    nl: >-
      Hulp nodig of een wijziging aanvragen? Gebruik op de tab Account het formulier "Request
      support or expansion": kies een categorie (Question, Problem, Access request, Other), een
      onderwerp (maximaal 200 tekens) en je bericht (maximaal 5000 tekens). Je krijgt een
      referentienummer (SR-nummer) en ziet je verzoeken onder "My requests". Je kunt maximaal 5
      verzoeken per uur en 20 per dag indienen. Zet geen persoonsgegevens of wachtwoorden in een
      verzoek.
    en: >-
      Need help or want to request a change? On the Account tab, use the "Request support or
      expansion" form: choose a category (Question, Problem, Access request, Other), a subject (up
      to 200 characters) and your message (up to 5000 characters). You receive a reference number
      (SR number) and see your requests under "My requests". You can submit up to 5 requests per
      hour and 20 per day. Do not put personal data or passwords in a request.

  expect:
    claims: [C1, C2, C3, C4, C5, C6]
    nl: >-
      Wat je van Valqeron mag verwachten: je gegevens zijn gescheiden van die van andere klanten;
      acties in jouw omgeving worden vastgelegd in een auditlog dat achteraf op wijzigingen is te
      controleren; persoonsgegevens in de tekst die je invoert worden herkend en vervangen door
      plaatshouders voordat de tekst naar het taalmodel gaat, en daarna in het resultaat
      teruggezet. Wat dit niet is: de herkenning is niet perfect, dus voer geen gegevens in die je
      niet aan een taalmodel wilt toevertrouwen; resultaten zijn voorstellen van een taalmodel en
      kunnen fouten bevatten; jullie beoordelen elk resultaat voordat je het gebruikt.
    en: >-
      What you can expect from Valqeron: your data is separated from other customers' data;
      actions in your environment are recorded in an audit log whose integrity can be verified
      afterwards; personal data in the text you enter is detected and replaced by placeholders
      before the text goes to the language model, and restored in the result afterwards. What this
      is not: detection is not perfect, so do not enter data you do not want to entrust to a
      language model; results are proposals from a language model and may contain errors; you
      review every result before you use it.

  limits:
    claims: [C14]
    allow_absolute: true
    nl: >-
      Wat nog niet kan: voor een deel van de workflows is in het portaal nog geen startformulier;
      die worden op aanvraag voor je ingericht (zie het blok per module). Het portaal heeft geen
      ingebouwde goedkeuringsstap: de beoordeling van een resultaat spreken jullie intern af.
      Bestanden uploaden als bewijsstuk kan nog niet. Het portaal is Engelstalig.
    en: >-
      What is not possible yet: for some workflows the portal does not yet have a start form;
      these are set up for you on request (see the block per module). The portal has no built-in
      approval step: you agree internally how a result is reviewed. Uploading files as evidence is
      not possible yet. The portal is in English.

  contact:
    claims: []
    nl_template: >-
      Wie bel je? Eerste lijn is een supportverzoek via het portaal. Voor spoed: {urgent_phone},
      {urgent_hours}. Beveiligings- of privacymelding: {security_contact}.
    en_template: >-
      Who do you call? First line is a support request through the portal. For urgent matters:
      {urgent_phone}, {urgent_hours}. For a security or privacy report: {security_contact}.

tabs:
  - key: home
    claims: []
    nl: >-
      Overzicht van je omgeving, recente runs en, zolang jullie onboarding loopt, de kaart
      "Onboarding progress".
    en: >-
      Overview of your environment, recent runs and, while your onboarding is in progress, the
      "Onboarding progress" card.

  - key: core
    claims: []
    nl: Informatie over Valqeron Core, de besturingslaag onder alle workflows.
    en: Information about Valqeron Core, the control layer under all workflows.

  - key: products
    claims: []
    nl: De workflows die voor jullie zijn ingericht.
    en: The workflows set up for you.

  - key: results
    claims: []
    nl: Alle resultaten van gedraaide workflows, met details per run.
    en: All results of workflows that have run, with details per run.

  - key: documents
    claims: []
    nl: >-
      Documenten uploaden en vragen stellen over je eigen documenten (als de module Document
      Intelligence actief is).
    en: >-
      Upload documents and ask questions about your own documents (if the Document Intelligence
      module is active).

  # Fase 0 (Batch M): the concept's text said "create and update incidents, risks, corrective
  # actions and evidence items" for all four, but the portal only gives risks and evidence a
  # full edit form. Incidents and corrective actions can be created and have their status
  # changed, never their title/description/owner/due-date edited after creation (confirmed by
  # reading GovernancePage.tsx in ai-governance-frontend: RiskRow/EvidenceRow have an "Edit"
  # button and inline edit form; IncidentRow/CorrectiveActionRow only have a status <select>).
  # Corrected per the hand-off's instruction ("pas de zin aan de code aan en meld het").
  - key: governance
    claims: [C11]
    nl: >-
      Overzicht van het AI-beleid, AI-systemen, risico's, incidenten, corrigerende maatregelen en
      bewijsstukken van je organisatie. Je kunt risico's en bewijsstukken aanmaken en bewerken, en
      incidenten en corrigerende maatregelen aanmaken en van status wijzigen (bij een corrigerende
      maatregel is een korte reden verplicht). Bewijsstukken zijn beschrijvingen van waar iets
      bewaard wordt, geen bestanden.
    en: >-
      Overview of your organisation's AI policy, AI systems, risks, incidents, corrective actions
      and evidence. You can create and edit risks and evidence items, and create incidents and
      corrective actions and change their status (a corrective action requires a short reason).
      Evidence items describe where something is kept; they are not files.

  - key: account
    claims: []
    nl: Wachtwoord, tweestapsverificatie en het indienen van een supportverzoek.
    en: Password, two-step verification and submitting a support request.
